<!-- country-search-input -->
<section class="flex flex-row gap-2 mt-2">
  <input type="text" #txtSearch (keyup.enter)="value.emit(txtSearch.value)"
  class="input input-bordered mr-2 w-56" [placeholder]="placeholder()" autofocus />
  <button class="btn btn-primary" (click)="value.emit(txtSearch.value)">Search</button>

</section>
